# pg_hba.conf – local-development override (trust auth, no password required)
# Mounted into the Postgres container and referenced via the -c hba_file flag
# so it takes effect even when the data volume already exists.
#
# TYPE  DATABASE  USER  ADDRESS      METHOD
local   all       all                trust
host    all       all   0.0.0.0/0    trust
host    all       all   ::/0         trust
